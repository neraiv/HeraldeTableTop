        .node text { pointer-events: none; font: 10px sans-serif; }
        #tooltip { position: absolute; background: white; padding: 5px; border: 1px solid #ccc; }
    </style>

              });

        function processData(data) {
            const nodes = [];
            const links = [];
            
            Object.entries(data).forEach(([sceneName, sceneData]) => {
                Object.entries(sceneData.layers).forEach(([layerId, layerData]) => {
                    const nodeId = `${sceneName}|${layerId}`;
                    
                    // Preserve existing position if available
                    const existingPos = positions[nodeId] || { x: null, y: null };
                    
                    nodes.push({
                        id: nodeId,
                        scene: sceneName,
                        layer: layerId,
                        discovered: sceneData.discovered,
                        type: 'layer',
                        x: existingPos.x,
                        y: existingPos.y
                    });

                    // Process portals
                    Object.values(layerData.locations.portals).forEach(portal => {
                        const targetScene = portal.scene || sceneName;
                        const targetLayer = portal.layer;
                        const targetId = `${targetScene}|${targetLayer}`;
                        
                        links.push({
                            source: nodeId,
                            target: targetId,
                            type: portal.type
                        });
                    });
                });
            });
            
            return { nodes, links };
        }

        function updateVisualization(nodes, links) {
            // Update nodes
            const node = svg.selectAll('.node')
                .data(nodes, d => d.id)
                .join(
                    enter => {
                        const g = enter.append('g')
                            .attr('class', d => `node ${d.discovered ? 'discovered' : 'undiscovered'}`)
                            .call(d3.drag()
                                .on('start', dragstarted)
                                .on('drag', dragged)
                                .on('end', dragended));

                        g.append('circle').attr('r', 10);
                        g.append('text')
                            .text(d => `${d.scene} L${d.layer}`)
                            .attr('x', 12)
                            .attr('y', 5);
                        return g;
                    },
                    update => update,
                    exit => exit.remove()
                );

            // Update links
            const link = svg.selectAll('.link')
                .data(links, d => `${d.source.id}-${d.target.id}`)
                .join('line')
                .attr('class', 'link')
                .attr('stroke', d => d.type === 'scene' ? '#2196F3' : '#FF9800');

            // Initialize or update simulation
            if (!simulation) {
                simulation = d3.forceSimulation(nodes)
                    .force('link', d3.forceLink(links).id(d => d.id).distance(100))
                    .force('charge', d3.forceManyBody().strength(-1000))
                    .force('center', d3.forceCenter(svg.attr('width')/2, svg.attr('height')/2))
                    .on('tick', ticked);
            } else {
                simulation.nodes(nodes);
                simulation.force('link').links(links);
                simulation.alpha(0.3).restart();
            }

            function ticked() {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node.attr('transform', d => `translate(${d.x},${d.y})`);
                
                // Store positions
                nodes.forEach(d => {
                    positions[d.id] = { x: d.x, y: d.y };
                });
            }

            // Add interactivity
            node.on('click', (event, d) => {
                tooltip
                    .style('left', `${event.pageX + 10}px`)
                    .style('top', `${event.pageY + 10}px`)
                    .html(`
                        <strong>${d.scene}</strong><br>
                        Layer: ${d.layer}<br>
                        Discovered: ${d.discovered ? 'Yes' : 'No'}
                    `);
            });

            node.on('mouseout', () => tooltip.style('opacity', 0));
            node.on('mouseover', () => tooltip.style('opacity', 1));
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            positions[d.id] = { x: d.fx, y: d.fy };
        }

        // Optional: Auto-refresh data every 30 seconds
        setInterval(() => {
            loadData();
        }, 30000);

        // Handle window resize
        window.addEventListener('resize', debounce(() => {
            svg.attr('width', window.innerWidth - 20)
               .attr('height', window.innerHeight - 20);
            simulation.force('center', d3.forceCenter(svg.attr('width')/2, svg.attr('height')/2));
            simulation.alpha(0.3).restart();
        }, 250));

        function debounce(func, wait) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
