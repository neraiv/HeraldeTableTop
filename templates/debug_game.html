<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop Board</title>
    <link rel="stylesheet" href="/static/styless/shared.css">
    <link rel="stylesheet" href="/static/styless/sheets.css">
    <link rel="stylesheet" href="/static/styless/gameboard.css">
    <link rel="stylesheet" href="/static/styless/ui.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined">
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>
<body>
    <div id="user-interface">
        <div id="ui-storage" class="menubar"></div>
        <div id="ui-spellbook" class="menubar"></div>
        <div id="ui-chat" class="menubar"></div>
        <div id="ui-bottom-bar" class="menubar"></div>
        <div id="ui-letside-bar" class="menubar"></div>
        <div id="ui-top-bar" class="menubar"></div>
    </div>

    <div id="gameboard">
        <div id="gameboard-content">
            <div id="grid-background"></div>
            <div id="background-layer" class="layer passive"></div> 
            <div id="character-layer" class="layer active"></div>
            <div id="fog-layer" class="layer passive"></div>
            <div id="drag-overlay" class="drag-circle"></div>
        </div>
    </div>

    <script src="/static/javascript/game_classess.js"></script>
    <script src="/static/javascript/consts.js"></script>
    <script src="/static/javascript/globals.js"></script>
    <script src="/static/javascript/shared_functions.js"></script>
    <script src="/static/javascript/database.js"></script>
    <script src="/static/javascript/ui_bringup.js"></script>

    <script src="/static/javascript/ui_sheet_char.js"></script>
    <script src="/static/javascript/ui_sheet_inventory.js"></script>
    <script src="/static/javascript/ui_sheet_spell.js"></script>
    <script src="/static/javascript/ui_sheet_quest.js"></script>

    <script src="/static/javascript/ui_token_background.js"></script>
    <script src="/static/javascript/ui_token_char.js"></script>
    <script src="/static/javascript/ui_token_npc.js"></script>
    <script src="/static/javascript/ui_token_objects.js"></script>
    <script src="/static/javascript/ui_token_portal.js"></script>

    <script src="/static/javascript/ui_func_chat.js"></script>
    <script src="/static/javascript/ui_func_inits.js"></script>
    <script src="/static/javascript/ui_func_gameboard.js"></script>
    
    <script src="/static/javascript/ui_functions.js"></script>
</body>
</html>
