<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder</title>
    <style>
        body {
            margin: 0;
            font-family: 'Garamond', serif;
            background-size: cover;
            color: #f5e3a1;
        }
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 0px 0px 10px #000, 0px 0px 20px #fff;
        }
        .login-form {
            max-width: 400px;
            width: 100%;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            font-size: 1em;
        }
        button {
            padding: 10px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #ffd700;
            color: #000;
            text-shadow: 0px 0px 5px #000;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #ffae00;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Welcome to the Realm</h1>
        <form class="login-form">
            <div class="form-group">
                <label for="server-key">Server Key</label>
                <input type="text" id="server-key" name="server-key" placeholder="Enter Server Key" value="123521">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" name="password" placeholder="Enter Password">
            </div>
            <button id="login-button" type="submit">Login</button>
            <button id="editor-button" type="submit" style= "display: none;">Editor</button>
            <button id="enter-button" type="submit" style= "display: none;">Enter</button>
        </form>
        <div class="footer">
            <p>Adventurers' Guild © 2024</p>
        </div>
    </div>
</body>
    <script src = "/static/javascript/shared_functions.js"></script>
    <script src = "/static/javascript/login/login.js"></script>
</html>
