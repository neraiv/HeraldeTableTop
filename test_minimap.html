<!DOCTYPE html>
<html>
<head>
    <title>D&D Map Visualizer</title>
    <style>
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .map-layer {
            position: absolute;
            border: 2px solid #666;
            transition: transform 0.3s;
        }

        .portal {
            position: absolute;
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .portal:hover {
            background: rgba(0, 255, 255, 0.5);
        }

        .character {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #0f0;
            border-radius: 50%;
            border: 2px solid darkgreen;
        }

        .npc {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0f;
            border-radius: 50%;
            border: 2px solid darkmagenta;
        }

        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

        let currentScene = "The Royal Bank";
        let currentLayer = "1";
        let scale = 1;
        let panX = 0;
        let panY = 0;

        function renderMap() {
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            
            const scene = sceneData[currentScene];
            const layer = scene.layers[currentLayer];
            
            // Update location display
            document.getElementById('current-location').textContent = 
                `${currentScene} - Layer ${currentLayer}`;

            // Create layer image
            const layerDiv = document.createElement('div');
            layerDiv.className = 'map-layer';
            layerDiv.style.backgroundImage = `url(${layer.img})`;
            layerDiv.style.width = `${layer.width}px`;
            layerDiv.style.height = `${layer.height}px`;
            layerDiv.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            container.appendChild(layerDiv);

            // Add portals
            Object.entries(layer.locations.portals).forEach(([id, portal]) => {
                const portalDiv = document.createElement('div');
                portalDiv.className = 'portal';
                portalDiv.style.left = `${portal.x}px`;
                portalDiv.style.top = `${portal.y}px`;
                portalDiv.style.width = `${portal.width}px`;
                portalDiv.style.height = `${portal.height}px`;
                portalDiv.title = `Portal to ${portal.scene} (Layer ${portal.layer})`;
                portalDiv.onclick = () => handlePortalClick(portal);
                layerDiv.appendChild(portalDiv);
            });

            // Add characters
            Object.entries(layer.locations.chars).forEach(([id, char]) => {
                const charDiv = document.createElement('div');
                charDiv.className = 'character';
                charDiv.style.left = `${char.x}px`;
                charDiv.style.top = `${char.y}px`;
                charDiv.title = id;
                layerDiv.appendChild(charDiv);
            });

            // Add NPCs
            Object.entries(layer.locations.npcs).forEach(([id, npc]) => {
                const npcDiv = document.createElement('div');
                npcDiv.className = 'npc';
                npcDiv.style.left = `${npc.x}px`;
                npcDiv.style.top = `${npc.y}px`;
                npcDiv.title = id;
                layerDiv.appendChild(npcDiv);
            });
        }

        function handlePortalClick(portal) {
            if (portal.type === 'scene') {
                currentScene = portal.scene;
                currentLayer = portal.layer;
            } else if (portal.type === 'layer') {
                currentLayer = portal.layer;
            }
            resetView();
            renderMap();
        }

        function resetView() {
            scale = 1;
            panX = 0;
            panY = 0;
            renderMap();
        }

        // Add pan/zoom functionality
        let isDragging = false;
        let startX, startY;

        document.getElementById('map-container').addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            renderMap();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.min(Math.max(0.5, scale * delta), 3);
            renderMap();
        });

        // Initial render
        renderMap();
